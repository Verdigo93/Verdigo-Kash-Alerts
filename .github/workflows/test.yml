name: Python tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile bot.py start_local.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
